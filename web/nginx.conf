# nginx สำหรับ serve Angular SPA + proxy /api ไปยัง API container
# ใช้ภายใน container เท่านั้น (ไม่ terminate TLS ที่นี่ — ให้ ALB/reverse proxy ชั้นนอกจัดการ)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ซ่อน version ของ nginx (secure by default)
    server_tokens off;

    # security headers พื้นฐาน
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # health สำหรับ container/ALB probe
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # proxy API — ชื่อ host "api" มาจาก service ใน docker compose
    # บังคับ X-Forwarded-Proto=https เพื่อให้ API (UseHttpsRedirection) ไม่ redirect ซ้ำ
    # (nginx เป็น edge ของ container network; TLS จริงอยู่ที่ ALB ชั้นนอกตอน deploy)
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Angular SPA — fallback ทุก route ไป index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
