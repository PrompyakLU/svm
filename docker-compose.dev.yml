# SQL Server สำหรับ dev local เท่านั้น (ไม่ใช่ production)
# รหัสผ่าน SA อ่านจาก .env (SVM_SA_PASSWORD) ซึ่งถูก gitignore ไว้ — ห้าม commit
# รัน: docker compose -f docker-compose.dev.yml up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    container_name: svm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SVM_SA_PASSWORD:?ตั้งค่า SVM_SA_PASSWORD ในไฟล์ .env ก่อน}
    ports:
      # ผูกเฉพาะ loopback — ไม่เปิดให้เครื่องอื่นในเครือข่ายเข้าถึง
      - "127.0.0.1:1433:1433"
    volumes:
      - svm-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  svm-sqldata:
